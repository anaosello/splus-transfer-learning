name: splus-tl
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip

  # PyTorch with CUDA 12.1
  - pytorch::pytorch>=2.1
  - pytorch::torchvision>=0.16
  - pytorch::pytorch-cuda=12.1

  - pip:
      - pytorch-lightning>=2.1
      - torchmetrics>=1.2

      # HuggingFace (DeiT and other transformers)
      - transformers>=4.35
      - accelerate>=0.24

      # Tabular ML
      - scikit-learn>=1.3
      - imbalanced-learn>=0.11

      # Data / utils
      - pandas>=2.0
      - numpy>=1.24
      - joblib>=1.3
      - tqdm

      # Visualization
      - matplotlib>=3.7
      - seaborn>=0.13
      - pillow>=10.0

      # Astronomy
      - astropy>=5.3

      # Notebook
      - jupyterlab>=4.0
      - ipywidgets
